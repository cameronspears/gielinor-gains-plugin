name: Build

on:
  push:
  pull_request:
  schedule:
    # Weekly, against RuneLite's latest release, so an API change shows before the hub build does.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 11
      - name: Build and test
        run: ./gradlew --no-daemon build
